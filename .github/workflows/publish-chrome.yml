# Upload (and optionally submit) QueueDeck to the Chrome Web Store.
# Requires one-time OAuth secrets — see docs/store-listing.md "GitHub publish".
name: Publish Chrome Web Store

on:
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: "After upload, submit the draft for CWS review / publish"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run tests
        run: node --test test/*.test.js

      - name: Package extension zip
        run: bash scripts/package.sh

      - name: Resolve zip path
        id: zip
        run: |
          VERSION="$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")"
          echo "path=QueueDeck-${VERSION}.zip" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches manifest (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="${{ steps.zip.outputs.version }}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match manifest version $VERSION"
            exit 1
          fi

      - name: Upload to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: ${{ steps.zip.outputs.path }}
          extension-id: ${{ secrets.CWS_EXTENSION_ID }}
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
          # Tag pushes always submit. Manual runs honor the workflow input.
          publish: ${{ github.event_name == 'push' || inputs.submit_for_review }}
